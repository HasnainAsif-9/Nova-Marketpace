<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — NovaMarket</title>
  <meta name="description" content="Complete your order securely.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container section-sm">
    <div class="page-header">
      <h1>Checkout</h1>
    </div>

    <div class="checkout-steps" id="checkout-steps">
      <div class="step active" data-step="1">1. Address</div>
      <div class="step" data-step="2">2. Delivery</div>
      <div class="step" data-step="3">3. Payment</div>
      <div class="step" data-step="4">4. Confirm</div>
    </div>

    <div class="grid" style="grid-template-columns:1fr 380px;align-items:start">
      <div>
        <!-- Step 1: Address -->
        <section id="step-address" class="card" style="padding:var(--nm-space-5);margin-bottom:var(--nm-space-4)">
          <h3 class="mb-4">Shipping Address</h3>
          <div id="address-list"></div>
          <form id="new-address-form" class="mt-4">
            <h4 class="mb-3">Add New Address</h4>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Recipient Name *</label><input name="recipient_name" class="form-control" required></div>
              <div class="form-group"><label class="form-label">Phone *</label><input name="phone" class="form-control" required></div>
            </div>
            <div class="form-group"><label class="form-label">Address Line 1 *</label><input name="address_line1" class="form-control" required></div>
            <div class="form-group"><label class="form-label">Address Line 2</label><input name="address_line2" class="form-control"></div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">City *</label><input name="city" class="form-control" required></div>
              <div class="form-group"><label class="form-label">State</label><input name="state" class="form-control"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Postal Code</label><input name="postal_code" class="form-control"></div>
              <div class="form-group"><label class="form-label">Country</label><input name="country" class="form-control" value="Pakistan"></div>
            </div>
            <label class="form-check mb-3"><input type="checkbox" name="is_default"> Set as default address</label>
            <button type="submit" class="btn btn-outline">Save Address</button>
          </form>
        </section>

        <!-- Step 2: Delivery -->
        <section id="step-delivery" class="card hidden" style="padding:var(--nm-space-5);margin-bottom:var(--nm-space-4)">
          <h3 class="mb-4">Delivery Method</h3>
          <div id="delivery-options"></div>
        </section>

        <!-- Step 3: Payment -->
        <section id="step-payment" class="card hidden" style="padding:var(--nm-space-5);margin-bottom:var(--nm-space-4)">
          <h3 class="mb-4">Payment Method</h3>
          <label class="card" style="padding:var(--nm-space-4);display:flex;align-items:center;gap:var(--nm-space-3);cursor:pointer;border:2px solid var(--nm-primary)">
            <input type="radio" name="payment" value="cod" checked>
            <i class="fas fa-money-bill-wave" style="font-size:1.4rem;color:var(--nm-primary)"></i>
            <div><strong>Cash on Delivery</strong><div class="text-sm text-muted">Pay when your order arrives</div></div>
          </label>
          <p class="text-sm text-muted mt-3"><i class="fas fa-info-circle"></i> Online payments coming soon. All orders are secured with buyer protection.</p>
        </section>

        <!-- Step 4: Confirm -->
        <section id="step-confirm" class="card hidden" style="padding:var(--nm-space-5)">
          <h3 class="mb-4">Review & Place Order</h3>
          <div id="order-review"></div>
          <div class="form-group mt-4">
            <label class="form-label">Order Notes (optional)</label>
            <textarea id="order-notes" class="form-textarea" placeholder="Any special instructions for delivery..."></textarea>
          </div>
          <button class="btn btn-primary btn-lg btn-block" id="place-order-btn">
            <i class="fas fa-check"></i> Place Order
          </button>
        </section>
      </div>

      <aside>
        <div class="summary-card">
          <h3 class="mb-4">Order Summary</h3>
          <div id="summary-items"></div>
          <div class="summary-row"><span>Subtotal</span><strong id="sum-subtotal">—</strong></div>
          <div class="summary-row"><span>Delivery</span><strong id="sum-delivery">—</strong></div>
          <div class="summary-row total"><span>Total</span><span id="sum-total">—</span></div>
        </div>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/checkout.js"></script>
</body>
</html>
