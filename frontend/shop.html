<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Products — NovaMarket</title>
  <meta name="description" content="Browse all products on NovaMarket. Filter by category, price, rating and more.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NovaMarket">
  <meta property="og:title" content="Shop All Products — NovaMarket">
  <meta property="og:description" content="Browse all products on NovaMarket. Filter by category, price, rating and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container section-sm">
    <div class="page-header">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a> / <span>Shop</span></nav>
      <h1>Shop All Products</h1>
    </div>

    <div class="shop-layout">
      <!-- Filters -->
      <aside class="filter-panel" aria-label="Product filters">
        <div class="filter-group">
          <h4>Search</h4>
          <input type="search" id="filter-q" class="form-control" placeholder="Search within results...">
        </div>
        <div class="filter-group">
          <h4>Category</h4>
          <div id="filter-categories"><div class="skeleton" style="height:20px"></div></div>
        </div>
        <div class="filter-group">
          <h4>Price (Rs.)</h4>
          <div class="price-range">
            <input type="number" id="filter-min" placeholder="Min" min="0">
            <span>—</span>
            <input type="number" id="filter-max" placeholder="Max" min="0">
          </div>
        </div>
        <div class="filter-group">
          <h4>Minimum Rating</h4>
          <select id="filter-rating" class="form-select">
            <option value="0">Any rating</option>
            <option value="3">3★ & up</option>
            <option value="4">4★ & up</option>
            <option value="4.5">4.5★ & up</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-option"><input type="checkbox" id="filter-instock"> In stock only</label>
          <label class="filter-option"><input type="checkbox" id="filter-onsale"> On sale</label>
        </div>
        <button class="btn btn-outline btn-sm btn-block" id="clear-filters">Clear all filters</button>
      </aside>

      <!-- Results -->
      <div>
        <div class="shop-toolbar">
          <span class="result-count" id="result-count">Loading...</span>
          <select id="sort-select" class="sort-select" aria-label="Sort products">
            <option value="newest">Newest</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
            <option value="popular">Most Popular</option>
          </select>
        </div>
        <div class="grid grid-4" id="product-grid">
          <div class="skeleton" style="height:340px"></div>
          <div class="skeleton" style="height:340px"></div>
          <div class="skeleton" style="height:340px"></div>
          <div class="skeleton" style="height:340px"></div>
        </div>
        <div id="pagination-wrap"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/products.js"></script>
  <script src="/assets/js/shop.js"></script>
</body>
</html>
