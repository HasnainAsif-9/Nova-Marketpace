<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NovaMarket</title>
  <meta name="description" content="Choose a new NovaMarket password.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Reset password</h1>
      <p class="auth-sub">Choose a new password for your account.</p>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="reset-pass">New password</label>
          <input id="reset-pass" class="form-control" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="reset-pass2">Confirm new password</label>
          <input id="reset-pass2" class="form-control" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="reset-btn">Reset Password</button>
      </form>

      <p class="text-center text-sm mt-4"><a href="/login.html" class="text-muted">← Back to sign in</a></p>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
