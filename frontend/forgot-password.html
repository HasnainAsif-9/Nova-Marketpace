<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — NovaMarket</title>
  <meta name="description" content="Reset your NovaMarket password.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Forgot password?</h1>
      <p class="auth-sub">Enter your account email and we'll send you a reset link.</p>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="forgot-email">Email</label>
          <input id="forgot-email" class="form-control" type="email" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="forgot-btn">Send Reset Link</button>
      </form>

      <p class="text-center text-sm mt-4"><a href="/login.html" class="text-muted">← Back to sign in</a></p>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
